name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: TypeScript + Jest + testID Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn ts:check

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Jest tests
        run: yarn test --ci --colors=false

      - name: testID validation
        run: yarn e2e:testid:validate

      - name: Coverage matrix validation
        run: yarn e2e:coverage:validate

  maestro-ios:
    name: Maestro iOS E2E
    runs-on: macos-latest
    timeout-minutes: 30
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for runtime, devices in data['devices'].items():
              for d in devices:
                if d['isAvailable'] and 'iPhone 16' in d['name']:
                  print(d['udid'])
                  sys.exit(0)
            sys.exit(1)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID"

      - name: Build and install app
        run: |
          npx expo run:ios --device "$DEVICE_ID"
        timeout-minutes: 30

      - name: Run Maestro smoke tests
        run: maestro test e2e/ios/smoke --format junit --output maestro-ios-results.xml
        continue-on-error: true

      - name: Retry failed Maestro tests
        if: failure()
        run: maestro test e2e/ios/smoke --format junit --output maestro-ios-results-retry.xml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-results
          path: maestro-ios-*.xml

  maestro-android:
    name: Maestro Android E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: AVD Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34

      - name: Run Android E2E in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: |
            cd android && ./gradlew assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            cd ..
            maestro test e2e/android/smoke --format junit --output maestro-android-results.xml || \
              maestro test e2e/android/smoke --format junit --output maestro-android-results-retry.xml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-results
          path: maestro-android-*.xml
