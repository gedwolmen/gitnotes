name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: TypeScript + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          yarn install

      - name: Update lockfile if changed
        run: |
          git diff --quiet yarn.lock || (git config user.email "ci@github.com" && git config user.name "CI" && git add yarn.lock && git commit -m "ci: update stale yarn.lock" && git push)

      - name: TypeScript check
        run: yarn ts:check

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check
