# Floating AI sparkle button: tap from Notes, lands on ChatThreadList.
# stopApp before launch so we start from a clean nav stack.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 1200

# If app restores into ChatScreen with an active stream, stop it first and
# back out to tab screens before tab-bar navigation.
- runFlow:
    when:
      visible:
        text: 'Cancel'
    commands:
      - tapOn: 'Cancel'
      - waitForAnimationToEnd:
          timeout: 800

- runFlow:
    when:
      visible:
        text: 'Back'
    commands:
      - tapOn: 'Back'
      - waitForAnimationToEnd:
          timeout: 900

- runFlow:
    when:
      visible:
        text: 'Back'
    commands:
      - tapOn: 'Back'
      - waitForAnimationToEnd:
          timeout: 900

# Foreground guard: if app is not on an in-app tab screen (e.g. simulator home
# screen), relaunch before any tab taps.
- runFlow:
    when:
      notVisible:
        id: 'tab-bar.*tab.press-NotesTab'
    commands:
      - runFlow:
          when:
            visible:
              text: 'Back'
          commands:
            - tapOn: 'Back'
            - waitForAnimationToEnd:
                timeout: 1000
      - launchApp:
          clearState: false
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      notVisible:
        id: 'tab-bar.*tab.press-NotesTab'
    commands:
      - runFlow:
          when:
            visible:
              text: 'Back'
          commands:
            - tapOn: 'Back'
            - waitForAnimationToEnd:
                timeout: 1000
- assertVisible:
    id: 'tab-bar.*tab.press-NotesTab'
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 1500

# Lightweight recovery when FAB is not visible: relaunch and retry from Notes.
- runFlow:
    when:
      notVisible:
        id: 'floating-ai.button.navigate-chat'
    commands:
      - launchApp:
          clearState: false
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          when:
            visible:
              text: 'Back'
          commands:
            - tapOn: 'Back'
            - waitForAnimationToEnd:
                timeout: 900
      - runFlow:
          when:
            notVisible:
              id: 'tab-bar.*tab.press-NotesTab'
          commands:
            - launchApp:
                clearState: false
            - waitForAnimationToEnd:
                timeout: 1200
      - tapOn:
          id: 'tab-bar.*tab.press-NotesTab'
      - waitForAnimationToEnd:
          timeout: 1200

- tapOn:
    id: 'floating-ai.button.navigate-chat'
- waitForAnimationToEnd:
    timeout: 1500

# ChatThreadList shows either a list of past chats or an empty
# sparkle-decorated state. Either way the screen renders without crash.
- assertVisible:
    text: '.*[Cc]hat.*|.*[Mm]odel.*|.*[Aa]I.*|.*[Ss]tart.*|.*New.*'
