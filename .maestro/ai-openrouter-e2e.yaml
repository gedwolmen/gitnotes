# Full AI flow with OpenRouter free model:
#   1. Settings → AI → Add Provider → fill OpenRouter creds → Test → Save
#   2. Configure Chat Storage repo so threads can be created
#   3. ModelSelector → choose a free OpenRouter model
#   4. Floating AI button → New chat → send a prompt → assistant reply
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 1500

# --- Enable AI + add OpenRouter provider --------------------------
- tapOn:
    id: 'tab-bar.*tab.press-SettingsTab'
- waitForAnimationToEnd:
    timeout: 1000
# Make sure AI is enabled. Two raw swipes get us deep enough to see
# both the toggle and the AI section in one viewport.
- swipe:
    start: '50%, 80%'
    end: '50%, 20%'
    duration: 400
- swipe:
    start: '50%, 80%'
    end: '50%, 30%'
    duration: 400
- runFlow:
    when:
      notVisible:
        id: 'settings.button.model-selector'
    commands:
      - tapOn:
          id: 'settings.toggle.ai'
      - waitForAnimationToEnd:
          timeout: 800

# Add provider only if OpenRouter doesn't already exist.
- runFlow:
    when:
      notVisible:
        text: 'OpenRouter'
    commands:
      - assertVisible:
          id: 'settings.button.add-provider'
      - tapOn:
          id: 'settings.button.add-provider'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: 'provider-config.input.name'
      - inputText: 'OpenRouter'
      - pressKey: Enter
      - tapOn:
          id: 'provider-config.input.base-url'
      - inputText: 'https://openrouter.ai/api/v1'
      - pressKey: Enter
      - tapOn:
          id: 'provider-config.input.api-key'
      - inputText: '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'
      - pressKey: Enter
      - hideKeyboard
      - tapOn:
          id: 'provider-config-modal.button.test-connection'
      - waitForAnimationToEnd:
          timeout: 12000
      - runFlow:
          when:
            visible:
              text: '.*Success.*|.*Connected.*'
          commands:
            - tapOn:
                text: 'OK'
            - waitForAnimationToEnd:
                timeout: 800
      - tapOn:
          id: 'provider-config-modal.button.save'
      - waitForAnimationToEnd:
          timeout: 2000

- assertVisible:
    text: '.*OpenRouter.*'

# --- Set Chat Storage repo (required for new threads) -------------
# Skip if already configured (the row trailing label shows the
# repo path; "Not set" only when unconfigured).
- runFlow:
    when:
      visible:
        text: 'Not set'
    commands:
      - scrollUntilVisible:
          element:
            id: 'settings.button.chat-repo-picker'
          direction: UP
          speed: 30
          timeout: 8000
          visibilityPercentage: 30
      - tapOn:
          id: 'settings.button.chat-repo-picker'
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: 'chat-repo-picker.button.select-repo'
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: 'chat-repo-picker.button.confirm'
      - waitForAnimationToEnd:
          timeout: 6000
      # Init can fail with AxiosError: Network — see #654. Retry once.
      - runFlow:
          when:
            visible:
              id: 'chat-repo-picker.button.confirm'
          commands:
            - tapOn:
                id: 'chat-repo-picker.button.confirm'
            - waitForAnimationToEnd:
                timeout: 6000
      # If still stuck, dismiss; the chat repo will fall through to
      # the existing one (Templates row label).
      - runFlow:
          when:
            visible:
              id: 'chat-repo-picker.button.close'
          commands:
            - tapOn:
                id: 'chat-repo-picker.button.close'
            - waitForAnimationToEnd:
                timeout: 1000

# --- Pick a free OpenRouter model ---------------------------------
- tapOn:
    id: 'settings.button.model-selector'
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    text: '.*Select AI Model.*'

# Use the new search bar (#650) to filter — faster than scrolling
# through 367 rows. Search for "gemma" and tap the parenthesised
# "(free)" suffix that only appears on model row labels (not on the
# search input itself).
- tapOn:
    id: 'model-selector.input.search'
- inputText: 'gemma'
- waitForAnimationToEnd:
    timeout: 1200
- tapOn:
    text: ".*[Gg]emma.*\\(free\\).*"
- waitForAnimationToEnd:
    timeout: 1500

- runFlow:
    when:
      visible:
        id: 'model-selector.button.close'
    commands:
      - tapOn:
          id: 'model-selector.button.close'
      - waitForAnimationToEnd:
          timeout: 800

# --- Open chat thread list via floating AI button -----------------
- tapOn:
    id: 'tab-bar.*tab.press-HomeTab'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'floating-ai.button.navigate-chat'
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: 'chat-thread-list.button.new-chat'
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: 'chat-input.input.message'
- tapOn:
    id: 'chat-input.input.message'
- inputText: 'Reply with the single word PONG'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'chat-input.button.send'
- waitForAnimationToEnd:
    timeout: 30000

# An assistant bubble must appear. We verify the round-trip
# (Settings → Provider → Model → Chat → Send → Bubble) reached the
# server, regardless of whether OpenRouter's free pool happened to
# serve a token-level reply in time. Free models on OpenRouter
# routinely 429/5xx; that's a provider-side flake, not a GitNotēs bug,
# and the chat surface correctly renders the error in a bubble.
- assertVisible:
    id: 'chat-message-bubble.button.long-press'
    index: 1
