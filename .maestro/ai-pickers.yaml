# AI-related pickers in Settings: ModelSelector, ChatRepoPicker,
# TemplatesRepoPicker. Each picker is opened from a fresh launch
# because chaining picker→close→picker leaves the next Modal inert
# (see #642). scrollUntilVisible overshoots on this Settings page,
# so we use raw swipes to land on each row.
appId: com.xaventra.gitnotes
---
# --- ModelSelector --------------------------------------------------
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Settings"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- tapOn:
    id: "settings.button.model-selector"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: ".*Select AI Model.*"
- tapOn:
    id: "model-selector.button.close"
- waitForAnimationToEnd:
    timeout: 1000

# --- ChatRepoPicker (fresh launch) ----------------------------------
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Settings"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- tapOn:
    id: "settings.button.chat-repo-picker"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "chat-repo-picker.button.close"
- tapOn:
    id: "chat-repo-picker.button.close"
- waitForAnimationToEnd:
    timeout: 1000

# --- TemplatesRepoPicker (fresh launch) -----------------------------
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Settings"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
    duration: 400
- tapOn:
    id: "settings.button.templates-repo-picker"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "settings-modals.button.close-templates-repo"
- tapOn:
    id: "settings-modals.button.close-templates-repo"
- waitForAnimationToEnd:
    timeout: 1000

- assertVisible: "Settings"
