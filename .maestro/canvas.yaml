# Canvas create + save round-trip. Skips drawing strokes (the gesture
# composition is the recent fix and is best verified by hand). Confirms
# the new editor mounts, the title field accepts input, the save action
# fires, and the new canvas appears in the list.
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: false
- tapOn:
    id: "tab-bar.*tab.press-HomeTab"
- tapOn:
    text: ".*Canvases.*"
- waitForAnimationToEnd:
    timeout: 1500

# Tap empty-state CTA if no canvases, otherwise the header "+" button.
- runFlow:
    when:
      visible: "Create Canvas"
    commands:
      - tapOn:
          id: "canvas-list.button.create"
- runFlow:
    when:
      notVisible: "Create Canvas"
    commands:
      - tapOn:
          id: "canvas-list.icon-button.new-canvas"
- waitForAnimationToEnd:
    timeout: 1200
- assertVisible:
    text: ".*Phone.*1080.*"

# #648 added per-row testIDs but the parent dismiss-overlay
# (TouchableOpacity around the whole modal) still folds children into
# one a11y group — see #649. Until that lands, point-tap the Phone row.
- tapOn:
    point: "50%, 33%"
- waitForAnimationToEnd:
    timeout: 1500

# Editor open. Set a unique title and save.
- assertVisible:
    id: "canvas-editor.input.title"
- tapOn:
    id: "canvas-editor.input.title"
- inputText: "Maestro canvas one"
# hideKeyboard occasionally fails on this build; tap a static area
# (status bar) to dismiss the keyboard before tapping save.
- tapOn:
    point: "50%, 5%"
- waitForAnimationToEnd:
    timeout: 700
- tapOn:
    id: "canvas-editor.button.save"
- waitForAnimationToEnd:
    timeout: 2000

# Land back on the canvases list and verify the new entry.
- assertVisible:
    text: ".*Canvases.*"
- assertVisible:
    text: ".*Maestro canvas one.*"
