# Clone-lag regression test for the gitFs fix.
# Verifies JS thread stays responsive during a real clone.
# Uses real onboarding with clipboard token — NO AsyncStorage seeding
# (AsyncStorage seed is overwritten by the app on first launch).
appId: com.xaventra.gitnotes
---
- stopApp
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# --------------------------------------------------------------------
# Phase 1: Dismiss any early iOS permission dialogs (notifications,
# paste, clipboard) before they can block UI interaction.
# --------------------------------------------------------------------
- runFlow:
    when:
      visible:
        text: '.*Allow.*|.*Don.t Allow.*|.*Paste.*|.*Clipboard.*'
    commands:
      - tapOn:
          text: "Don't Allow"
          optional: true
      - tapOn:
          text: '.*Don.t Allow.*'
          optional: true
      - tapOn:
          text: 'Allow'
          optional: true
      - waitForAnimationToEnd:
          timeout: 800

# --------------------------------------------------------------------
# Phase 2: Walk4 info steps + token step + AI step (real onboarding).
# Token is loaded from sim clipboard (pre-loaded by run script).
# --------------------------------------------------------------------
- assertVisible:
    text: '.*Welcome to GitNot.*'

# Step 1
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 800

# Step 2
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 800

# Step 3
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 800

# Step 4
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 800

# --------------------------------------------------------------------
# Token step — paste from clipboard.
# The paste permission dialog can appear either BEFORE or AFTER the
# paste button is tapped. We handle it both times.
# --------------------------------------------------------------------
- assertVisible:
    text: '.*Connect GitHub.*'
- assertVisible:
    id: 'onboarding.button.paste-token'

# Dismiss dialog BEFORE paste (covers the "before" case).
- runFlow:
    when:
      visible:
        text: '.*Allow.*|.*Don.t Allow.*|.*Paste.*|.*Clipboard.*'
    commands:
      - tapOn:
          text: "Don't Allow"
          optional: true
      - tapOn:
          text: '.*Don.t Allow.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 600

# Tap "Paste from Clipboard" — triggers Clipboard.getString().
- tapOn:
    id: 'onboarding.button.paste-token'
- waitForAnimationToEnd:
    timeout: 1500

# Dismiss dialog AFTER paste (covers the "after" case).
- runFlow:
    when:
      visible:
        text: '.*Allow.*|.*Don.t Allow.*|.*Paste.*|.*Clipboard.*'
    commands:
      - tapOn:
          text: "Don't Allow"
          optional: true
      - tapOn:
          text: '.*Don.t Allow.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 600

# Wait for token field to be populated, then tap Connect.
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 4000

# --------------------------------------------------------------------
# AI step — skip.
# --------------------------------------------------------------------
- assertVisible:
    text: '.*GitNot.s AI.*'
- tapOn:
    id: 'onboarding.button.skip-ai'
- waitForAnimationToEnd:
    timeout: 2000

# --------------------------------------------------------------------
# Phase 3: Land on Home, navigate to Settings, trigger clone.
# --------------------------------------------------------------------
- assertVisible:
    id: 'tab-bar.*tab.press-HomeTab'
- waitForAnimationToEnd:
    timeout: 2000

# Navigate to Settings — wait for Home tab to be enabled first.
- tapOn:
    id: 'tab-bar.*tab.press-SettingsTab'
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    text: '.*Settings.*'

# Scroll to and open Add Repository modal.
- scrollUntilVisible:
    element:
      id: 'settings.button.repo-picker'
    direction: DOWN
    speed: 30
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: 'settings.button.repo-picker'
- waitForAnimationToEnd:
    timeout: 2000

# Type repo path.
- assertVisible:
    id: 'settings-modals.input.manual-repo'
- tapOn:
    id: 'settings-modals.input.manual-repo'
- inputText: 'vidwadeseram/test-notes'
- waitForAnimationToEnd:
    timeout: 500

# Add.
- tapOn:
    id: 'settings-modals.button.add-manual-repo'
- waitForAnimationToEnd:
    timeout: 2500

# Dismiss leftover modal.
- tapOn:
    point: '10%,20%'
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

# Find the Clone toggle and start clone.
- scrollUntilVisible:
    element:
      id: 'settings.toggle.sync-engine-enable-vidwadeseram-test-notes'
    direction: DOWN
    speed: 30
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: 'settings.toggle.sync-engine-enable-vidwadeseram-test-notes'

# Wait for CloneProgressModal to appear.
- assertVisible:
    id: 'clone-progress.button.cancel'
- waitForAnimationToEnd:
    timeout: 1000

# --------------------------------------------------------------------
# Phase 4: Verify tap responsiveness — cancel should respond immediately
# even during clone (pre-fix:30s+ lag due to JS thread saturation).
# --------------------------------------------------------------------
- tapOn:
    id: 'clone-progress.button.cancel'
- waitForAnimationToEnd:
    timeout: 2000

# Verify modal dismissed (cancel responded).
- runFlow:
    when:
      visible:
        id: 'clone-progress.button.cancel'
    commands:
      - waitForAnimationToEnd:
          timeout: 3000

- stopApp
