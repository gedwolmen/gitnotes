# Regression for issue #636 (closed by #647 tombstone fix).
# Create a note, delete it, force-quit + relaunch, pull from GitHub.
# Pre-#647 the note resurrected because the local DELETE was in the
# queue but the next pull re-fetched the file. Post-#647 a tombstone
# blocks the resurrection.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 1500

# Create a uniquely named note.
- tapOn:
    id: 'notes-list.icon-button.add'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'note-editor-form.input.title'
- inputText: 'Maestro persistence probe'
- pressKey: Enter
- tapOn:
    id: 'note-editor.button.save'
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible:
    text: '.*Maestro persistence probe.*'

# Wait for the create to upload to GitHub before deleting — otherwise
# the delete runs first and the upload re-creates the row.
- waitForAnimationToEnd:
    timeout: 5000

# Delete it via swipe + bulk-delete.
- swipe:
    from:
      text: '.*Maestro persistence probe.*'
    direction: LEFT
- waitForAnimationToEnd:
    timeout: 600
- tapOn:
    id: 'bulk-action-bar.button.delete'
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible:
        text: '.*This cannot be undone.*'
    commands:
      - tapOn:
          text: '^Delete$'
      - waitForAnimationToEnd:
          timeout: 1500
- assertNotVisible:
    text: '.*Maestro persistence probe.*'

# Force-quit and relaunch. The note should stay gone.
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 3000

# Pull-to-refresh to force the same path the bug travels.
- swipe:
    start: '50%, 30%'
    end: '50%, 90%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 4000

- assertNotVisible:
    text: '.*Maestro persistence probe.*'
