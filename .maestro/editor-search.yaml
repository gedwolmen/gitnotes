# Open the top note in edit mode, toggle the in-editor search bar,
# assert it appears. Order-independent — uses index 0 instead of a
# specific seed name (the render-style probe was the original target
# but it's gone if render.yaml hasn't run yet).
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'notes-list.button.press-card-0'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'note-viewer.button.edit'
- waitForAnimationToEnd:
    timeout: 1200

- assertVisible:
    id: 'search-toggle'
- tapOn:
    id: 'search-toggle'
- waitForAnimationToEnd:
    timeout: 800

# After toggling, the in-editor search input should be focused. The
# component renders a TextInput with placeholder text.
- assertVisible:
    text: '.*Search.*'
