# Open the seed note in edit mode, toggle the in-editor search bar,
# assert it appears.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Notes"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*Maestro render check.*"
    direction: DOWN
    speed: 30
    timeout: 6000
    visibilityPercentage: 50
- tapOn: "Maestro render check"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "note-viewer.button.edit"
- waitForAnimationToEnd:
    timeout: 1200

- assertVisible:
    id: "search-toggle"
- tapOn:
    id: "search-toggle"
- waitForAnimationToEnd:
    timeout: 800

# After toggling, the in-editor search input should be focused. The
# component renders a TextInput with placeholder text.
- assertVisible:
    text: ".*Search.*"
