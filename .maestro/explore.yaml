# Explore tab: saved repo visible, can drill into the tree.
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: false
- tapOn:
    id: "tab-bar.*tab.press-ExploreTab"
- waitForAnimationToEnd:
    timeout: 1500

- assertVisible: "Explore"
- assertVisible:
    text: ".*test-notes.*"

- tapOn:
    text: ".*test-notes.*"
- waitForAnimationToEnd:
    timeout: 2500

# Inside a repo we expect at minimum the notes/ folder to be visible.
- assertVisible:
    text: ".*notes.*"
