# Tab navigation smoke. Cycle every tab; assert the landing screen
# title/header text is present so a black screen / mount crash fails fast.
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: false

- tapOn:
    id: 'tab-bar.*tab.press-HomeTab'
- assertVisible:
    text: '.*GitNot.*'

- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- assertVisible: 'Notes'
- assertVisible: 'Search notes...'

- tapOn:
    id: 'tab-bar.*tab.press-ExploreTab'
- assertVisible: 'Explore'

- tapOn:
    id: 'tab-bar.*tab.press-TodosTab'
- assertVisible: 'Todos'

- tapOn:
    id: 'tab-bar.*tab.press-SettingsTab'
- assertVisible: 'Settings'
