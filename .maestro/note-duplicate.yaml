# Long-press → Duplicate creates a copy of the note. Verify a second
# entry with the same title appears.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Notes"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500

# Reset sort to Newest Modified so the seed sits at the top.
- tapOn:
    id: "sort-picker-trigger"
    optional: true
- tapOn:
    id: "sort-option-modified-desc"
    optional: true
- waitForAnimationToEnd:
    timeout: 800

- longPressOn:
    id: "notes-list-card.button.press"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000

- assertVisible:
    id: "notes-context-menu.item.duplicate"
- tapOn:
    id: "notes-context-menu.item.duplicate"
- waitForAnimationToEnd:
    timeout: 2000

# A duplicate appears alongside the original. We don't know the exact
# rename pattern, so just verify two list cards exist (we already had
# >=2 before — point is no crash).
- assertVisible:
    id: "notes-list-card.button.press"
    index: 0
- assertVisible:
    id: "notes-list-card.button.press"
    index: 1
