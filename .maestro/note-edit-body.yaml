# Body editor fast-typing regression check (#632 / fix #644).
# Open an existing note, edit, paste a fast multi-line input into the
# body, save. Pre-fix: the MarkdownEditor tripped a max-update-depth
# loop on rapid input and the editor froze. Post-#644: this completes
# in under five seconds and the saved note shows the new body.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "tab-bar.*tab.press-NotesTab"
- waitForAnimationToEnd:
    timeout: 1200

# Reset sort to most-recent so we know the new note lands on top.
- tapOn:
    id: "sort-picker-trigger"
    optional: true
- tapOn:
    id: "sort-option-modified-desc"
    optional: true
- waitForAnimationToEnd:
    timeout: 800

# Create a probe note we can edit.
- tapOn:
    id: "notes-list.icon-button.add"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "note-editor-form.input.title"
- inputText: "Body editor probe"
- pressKey: Enter
- tapOn:
    id: "note-editor.button.save"
- waitForAnimationToEnd:
    timeout: 2000

# Re-open it for editing.
- tapOn:
    id: "notes-list-card.button.press"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "note-viewer.button.edit"
- waitForAnimationToEnd:
    timeout: 1500

# Body field: type fast. Anything before #644 deadlocks here.
- tapOn:
    id: "note-editor-form.input.content"
- waitForAnimationToEnd:
    timeout: 500
- inputText: "Line one of the body. Some inline `code`. **Bold**. _italic_."
- pressKey: Enter
- inputText: "- bullet a"
- pressKey: Enter
- inputText: "- bullet b"
- pressKey: Enter
- inputText: "- bullet c"
- pressKey: Enter
- inputText: "Final paragraph after a list."

# Save and confirm we land back on the viewer with rendered body.
# Pre-#644 the editor froze on the rapid input above and never made
# it here. Post-fix the rendered body is visible.
- tapOn:
    id: "note-editor.button.save"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    text: ".*Final paragraph after a list.*"

# No cleanup — just-edited notes race with their upload queue and
# bulk-delete leaves a tombstoned remnant. The probe lives on the
# real test-notes repo and is overwritten each run by its title.
