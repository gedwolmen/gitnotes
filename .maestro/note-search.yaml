# Notes search: type into the search bar, assert non-matching notes
# disappear, clear search, assert all back.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 1500

# Self-seed a probe note so this doesn't depend on render.yaml.
- tapOn:
    id: 'notes-list.icon-button.add'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'note-editor-form.input.title'
- inputText: 'Maestro search probe'
- pressKey: Enter
- tapOn:
    id: 'note-editor.button.save'
- waitForAnimationToEnd:
    timeout: 2500

# Type a search term that matches only the probe note.
- tapOn:
    text: 'Search notes...'
- inputText: 'search probe'
- waitForAnimationToEnd:
    timeout: 800

- assertVisible: 'Maestro search probe'
- assertNotVisible: 'TODOPROBE'
