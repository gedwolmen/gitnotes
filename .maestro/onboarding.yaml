# First-launch onboarding walkthrough. Uses clearState to wipe app
# data, walks the four info steps, skips token + AI, lands on Home.
appId: com.xaventra.gitnotes
---
- stopApp
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 4000

# iOS first-launch usually pops a notifications permission alert.
- runFlow:
    when:
      visible:
        text: '.*Allow.*'
    commands:
      - tapOn:
          text: "Don't Allow"
          optional: true
      - tapOn:
          text: '.*Don.t Allow.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 800

- assertVisible:
    text: '.*Welcome to GitNot.*'

# Walk the four info steps via Next.
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 800

# Token step — skip without entering anything; the same Next button
# becomes "Skip for Now" when the field is blank.
- assertVisible:
    text: '.*Connect GitHub.*'
- tapOn:
    id: 'onboarding.button.next'
- waitForAnimationToEnd:
    timeout: 1500

# AI step — skip.
- assertVisible:
    text: '.*GitNot.s AI.*'
- tapOn:
    id: 'onboarding.button.skip-ai'
- waitForAnimationToEnd:
    timeout: 1500

# Land on Home.
- assertVisible:
    id: 'tab-bar.*tab.press-HomeTab'
- assertVisible:
    text: '.*Create New Note.*|.*New Journal.*'
