# AI provider config modal: open Add Provider, fill name + base URL,
# save, find in list, delete. Smoke-only — does not store an API key
# the app would actually call.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: "tab-bar.*tab.press-SettingsTab"
- waitForAnimationToEnd:
    timeout: 1000

# Two big swipes get past Sync/Note rendering/Data/About to land at
# the AI section where Add Provider lives.
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
    duration: 400

# Enable AI iff Add Provider isn't visible (the rest of the AI section
# only renders when the AI toggle is on).
- runFlow:
    when:
      notVisible:
        id: "settings.button.add-provider"
    commands:
      - tapOn:
          id: "settings.toggle.ai"
      - waitForAnimationToEnd:
          timeout: 800

- tapOn:
    id: "settings.button.add-provider"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    id: "provider-config.input.name"
- inputText: "Maestro Probe Provider"
- pressKey: Enter

- tapOn:
    id: "provider-config.input.base-url"
- inputText: "https://example.invalid/v1"
- pressKey: Enter

- tapOn:
    id: "provider-config-modal.button.save"
- waitForAnimationToEnd:
    timeout: 1500

# Provider should appear in the list. Find + open it to delete.
- assertVisible:
    text: ".*Maestro Probe Provider.*"
- tapOn:
    text: ".*Maestro Probe Provider.*"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "provider-config.button.delete"
- waitForAnimationToEnd:
    timeout: 1000

# Confirm destructive iOS Alert if shown.
- runFlow:
    when:
      visible:
        text: ".*[Dd]elete.*[Pp]rovider.*|.*[Rr]emove.*[Pp]rovider.*"
    commands:
      - tapOn: "Delete"
      - waitForAnimationToEnd:
          timeout: 1000

- assertNotVisible:
    text: ".*Maestro Probe Provider.*"
