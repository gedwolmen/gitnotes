# Notes pull-to-refresh: drag down on the list, no crash.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: "tab-bar.*tab.press-NotesTab"
- waitForAnimationToEnd:
    timeout: 1500

- swipe:
    start: "50%, 30%"
    end: "50%, 90%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "Notes"
# Any note card is fine — we just need proof the list rendered after
# the refresh finished, not a specific seed.
- assertVisible:
    id: "notes-list-card.button.press"
    index: 0
