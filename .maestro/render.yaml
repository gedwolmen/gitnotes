# Render smoke. Creates a markdown note with task list + heading + bare
# URL link, opens preview, asserts the right glyphs/labels appear.
# Uses raw mode + slower stepwise typing so the editor's undo/redo
# state doesn't race with rapid inputText.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- waitForAnimationToEnd:
    timeout: 1200

# Reset sort to Newest Modified so the seed note is at the top if it
# exists. Best-effort — picker may already be on Newest Modified.
- tapOn:
    id: 'sort-picker-trigger'
    optional: true
- tapOn:
    id: 'sort-option-modified-desc'
    optional: true
- waitForAnimationToEnd:
    timeout: 800

- runFlow:
    when:
      visible:
        text: '.*Maestro render check.*'
    commands:
      - tapOn:
          text: '.*Maestro render check.*'

# Only create the seed note when we're still on the Notes list (the
# add button is visible) AND the seed isn't there yet — keeps the two
# branches mutually exclusive after the first runFlow opens the note.
- runFlow:
    when:
      visible:
        id: 'notes-list.icon-button.add'
      notVisible:
        text: '.*Maestro render check.*'
    commands:
      - tapOn:
          id: 'notes-list.icon-button.add'
      - waitForAnimationToEnd:
          timeout: 1200
      - tapOn:
          id: 'note-editor-form.input.title'
      - inputText: 'Maestro render check'
      - pressKey: Enter
      - tapOn:
          id: 'mode-raw'
      - waitForAnimationToEnd:
          timeout: 500
      - tapOn:
          id: 'note-editor-form.input.content'
      - inputText: '# Heading line'
      - pressKey: Enter
      - inputText: '- [ ] open task'
      - pressKey: Enter
      - inputText: '- [x] done task'
      - pressKey: Enter
      - inputText: '[docs](www.example.com)'
      - pressKey: Enter
      - tapOn:
          id: 'note-editor.button.save'
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: '.*Maestro render check.*'

- waitForAnimationToEnd:
    timeout: 2000

# Render assertions.
- assertVisible: 'Heading line'
- assertVisible:
    text: '.*☐.*open task.*'
- assertVisible:
    text: '.*☑.*done task.*'
- assertVisible:
    text: '.*docs.*'
