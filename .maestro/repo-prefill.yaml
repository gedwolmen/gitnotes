# Verify GitContextPicker auto-fills a repo on a fresh note. With a single
# saved repo it picks that one; with multiple it picks the last-used.
# Test rig has at least one saved repo (vidwadeseram/test-notes).
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-NotesTab'
- tapOn:
    id: 'notes-list.icon-button.add'
- waitForAnimationToEnd:
    timeout: 1500

# The trigger button shows the repo basename when one is selected, and
# the placeholder "Select repository" when not. Auto-fill should produce
# a repo name in the trigger.
- assertNotVisible: 'Select repository'
- assertVisible:
    text: '.*test-notes.*'
