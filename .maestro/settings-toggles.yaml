# Settings toggles smoke: biometric lock, lock-timeout picker open/close,
# theme, sync-frequently. Uses raw swipes to scroll because the page is
# long.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Settings"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000

# Theme + Updated UI toggles are at the top.
- assertVisible:
    id: "settings.toggle.theme"
- tapOn:
    id: "settings.toggle.theme"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "settings.toggle.theme"
- waitForAnimationToEnd:
    timeout: 500

# Sync section: scroll until "Sync frequently" lands in view, toggle.
- scrollUntilVisible:
    element:
      text: ".*Sync frequently.*"
    direction: DOWN
    speed: 30
    timeout: 8000
    visibilityPercentage: 30

- assertVisible:
    text: ".*Sync frequently.*"
- assertVisible:
    text: ".*Background Sync.*"
