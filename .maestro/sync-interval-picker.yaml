# Sync interval bottom-sheet picker. Only enabled when Sync frequently
# is on; assume default state (on). Pick a non-default option, verify
# label updates, restore to "Every minute".
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-SettingsTab'
- waitForAnimationToEnd:
    timeout: 1000

- swipe:
    start: '50%, 80%'
    end: '50%, 30%'
    duration: 400
- swipe:
    start: '50%, 80%'
    end: '50%, 60%'
    duration: 400

- tapOn:
    id: 'settings.button.interval-picker'
- waitForAnimationToEnd:
    timeout: 1500

- assertVisible:
    text: 'Sync interval'
- tapOn:
    id: 'sync-interval-option-300'
- waitForAnimationToEnd:
    timeout: 800

- assertVisible:
    text: '.*Every 5 minutes.*'

# Restore default.
- tapOn:
    id: 'settings.button.interval-picker'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'sync-interval-option-60'
- waitForAnimationToEnd:
    timeout: 800
- assertVisible:
    text: '.*Every minute.*'
