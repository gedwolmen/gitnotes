# Tag input on a fresh note: type a tag, hit Enter, chip appears, X removes.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: "tab-bar.*tab.press-NotesTab"
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "notes-list.icon-button.add"
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "note-editor-form.input.title"
- inputText: "Tag probe"
- pressKey: Enter

# Tag input has no testID; it has a known placeholder.
- tapOn:
    text: "Add tags..."
- inputText: "alpha"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 800

- assertVisible:
    text: ".*alpha.*"

# Cancel — don't litter the repo with probe notes.
- tapOn:
    id: "note-editor.button.cancel"
- waitForAnimationToEnd:
    timeout: 1000
