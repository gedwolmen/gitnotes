# Home → From Template tile → pick a template → editor opens with the
# template content prefilled. Cancel.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Home"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500

- assertVisible:
    text: ".*From Template.*"
- tapOn:
    text: ".*From Template.*"
- waitForAnimationToEnd:
    timeout: 1500

# Template selector should expose at least one built-in template.
- assertVisible:
    text: ".*[Mm]eeting.*|.*[Dd]aily.*|.*[Bb]ug.*|.*[Tt]ask.*|.*[Bb]lank.*|.*[Tt]emplate.*"

# Pick the first template row by tapping in the upper part of the
# selector list.
- tapOn:
    point: "50%, 35%"
- waitForAnimationToEnd:
    timeout: 1500

# Editor opens.
- assertVisible:
    id: "note-editor-form.input.title"
- tapOn:
    id: "note-editor.button.cancel"
- waitForAnimationToEnd:
    timeout: 1000
