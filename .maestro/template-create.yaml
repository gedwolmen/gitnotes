# Templates: create custom template (full form), verify in list, delete.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar.*tab.press-SettingsTab'
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: '50%, 80%'
    end: '50%, 20%'
    duration: 400
- tapOn:
    id: 'settings.button.manage-templates'
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: 'template-manager.icon-button.new-template'
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'template-editor.input.name'
    commands:
      - tapOn:
          id: 'template-manager.button.create'
          optional: true
- waitForAnimationToEnd:
    timeout: 1000

# Fill the form.
- tapOn:
    id: 'template-editor.input.name'
- inputText: 'Maestro probe template'
- pressKey: Enter

- tapOn:
    id: 'template-editor.input.description'
- inputText: 'Probe description'
- pressKey: Enter

- tapOn:
    id: 'template-editor.input.title'
- inputText: 'Probe -'
- pressKey: Enter

- tapOn:
    id: 'template-tag-input'
- inputText: 'probe'
- pressKey: Enter

# Pick a non-default icon (light bulb).
- tapOn:
    id: 'template-editor.button.select-icon-bulb-outline'
- waitForAnimationToEnd:
    timeout: 300

# Save.
- tapOn:
    id: 'template-editor.button.save'
- waitForAnimationToEnd:
    timeout: 1500

# Verify it appears in the list, then delete.
- assertVisible:
    text: '.*Maestro probe template.*'

# Find delete icon-button via partial id pattern (the id includes
# the template's generated id).
- tapOn:
    id: 'template-list-item.icon-button.delete-.*'
- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible:
        text: '.*[Dd]elete.*[Tt]emplate.*'
    commands:
      - tapOn: 'Delete'
      - waitForAnimationToEnd:
          timeout: 1000

- assertNotVisible:
    text: '.*Maestro probe template.*'
