# Templates manager: open new-template form, verify the recently-fixed
# margins (form not flush to screen edge), cancel out cleanly.
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: false
- tapOn:
    text: "Settings"
    index: 0
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 400
- tapOn:
    id: "settings.button.manage-templates"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: ".*[Tt]emplate.*"

# Open the new-template form via the header "+" or empty-state button.
- tapOn:
    id: "template-manager.icon-button.new-template"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "template-editor.input.name"
    commands:
      - tapOn:
          id: "template-manager.button.create"
          optional: true
- waitForAnimationToEnd:
    timeout: 1000

# Form fields visible (the recent fix — they used to render flush to
# the screen edge with no padding).
- assertVisible:
    id: "template-editor.input.name"
- assertVisible:
    id: "template-editor.input.description"
- assertVisible:
    id: "template-editor.view.icon-grid"

# Cancel out.
- tapOn:
    id: "template-editor.button.close"
- waitForAnimationToEnd:
    timeout: 1000
