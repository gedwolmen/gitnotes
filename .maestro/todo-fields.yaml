# Todo editor: priority cycle + notes input + due-date open. Cancel
# without saving.
appId: com.xaventra.gitnotes
---
- stopApp
- launchApp:
    clearState: false
- tapOn:
    text: "Todos"
    index: 0
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "todo-list.icon-button.add"
- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "todo-editor.input.title"
- inputText: "Field probe"
- pressKey: Enter

# Priority — three chips share a testID.
- tapOn:
    id: "todo-editor.button.priority"
    index: 0
- waitForAnimationToEnd:
    timeout: 200
- tapOn:
    id: "todo-editor.button.priority"
    index: 2
- waitForAnimationToEnd:
    timeout: 200
- tapOn:
    id: "todo-editor.button.priority"
    index: 1
- waitForAnimationToEnd:
    timeout: 200

# Notes (multi-line).
- tapOn:
    id: "todo-editor.input.notes"
- inputText: "probe notes"
- pressKey: Enter

# Due-date open + dismiss without picking.
- tapOn:
    id: "todo-editor.button.add-deadline"
    optional: true
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: "todo-editor.button.date-picker"
    optional: true
- waitForAnimationToEnd:
    timeout: 800

- tapOn:
    id: "todo-editor.button.cancel"
- waitForAnimationToEnd:
    timeout: 1000
