[workspace]
members = ["app", "crates/gn-core", "crates/gn-parser", "crates/gn-github"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
dioxus = "0.6.3"
dioxus-router = "0.6.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
