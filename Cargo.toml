[workspace]
members = ["app", "crates/gn-core", "crates/gn-parser", "crates/gn-github"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
dioxus = "0.6.3"
dioxus-router = "0.6.3"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
