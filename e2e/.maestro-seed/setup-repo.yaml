# Seed flow for E2E testing
appId: com.xaventra.gitnotes
---
- launchApp:
    clearState: true

# Skip onboarding if shown
- tapOn:
    id: "onboarding.button.skip"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "tab-bar.tab.press-SettingsTab"

# Try add-account first (when 2+ accounts), fallback to connect-github (fresh install)
- scrollUntilVisible:
    element:
      id: "settings.button.add-account"
    direction: UP
    timeout: 5000
    optional: true

- tapOn:
    id: "settings.button.add-account"
    optional: true

- scrollUntilVisible:
    element:
      id: "settings.button.connect-github"
    direction: UP
    timeout: 5000

- tapOn:
    id: "settings.button.connect-github"

- inputText:
    id: "settings-modals.input.token"
    text: "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"

# Save token and wait for verification
- tapOn:
    id: "settings-modals.button.save-token"

- waitForAnimationToEnd:
    timeout: 10000

# Now add manual repo
- inputText:
    id: "settings-modals.input.manual-repo"
    text: "test-owner/test-repo"

- tapOn:
    id: "settings-modals.button.add-manual-repo"
