appId: org.gitnotes.app
name: Android - Open Journal Flow
tags:
  - full
  - android
  - journal
---

- launchApp

- runFlow:
    file: ../smoke/onboarding.yaml

- waitForAnimationToEnd

- tapOn:
    id: "tab-bar.tab.press-HomeTab"

- tapOn:
    id: "home.button.open-journal"

- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible:
        text: ".*Add a repository.*|.*Repository Required.*"
    commands:
      - assertVisible:
          text: ".*Add a repository.*"
      - stopApp
