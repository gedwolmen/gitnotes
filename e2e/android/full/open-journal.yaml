appId: com.gitnotes.app
name: Android - Open Journal Flow
tags:
  - full
  - android
  - journal
---

- launchApp:
    clearState: false

- tapOn:
    id: "tab-bar.*tab.press-HomeTab"

- tapOn:
    id: "home.button.open-journal"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "note-viewer.button.edit"

- tapOn:
    id: "note-viewer.button.back"
