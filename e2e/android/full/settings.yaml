appId: com.gitnotes.app
name: Android - Settings Flow
tags:
  - full
  - android
  - settings
---

- launchApp

- tapOn:
    id: tab-bar.tab.press-SettingsTab

- assertVisible:
    text: "Settings"

- scrollUntilVisible:
    element:
      id: settings.toggle.neu
    direction: DOWN

- tapOn:
    id: settings.toggle.neu

- tapOn:
    id: settings.toggle.neu

- scrollUntilVisible:
    element:
      id: settings.toggle.sync-frequently
    direction: DOWN

- scrollUntilVisible:
    element:
      id: settings.toggle.background-sync
    direction: DOWN
