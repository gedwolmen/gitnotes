appId: org.gitnotes.app
name: Android - Template Manager Flow
tags:
  - full
  - android
  - templates
---

- launchApp

- runFlow:
    file: ../smoke/onboarding.yaml

- waitForAnimationToEnd

- tapOn:
    id: home.button.open-templates

- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible:
        text: ".*Add a repository.*|.*Repository Required.*"
    commands:
      - assertVisible:
          text: ".*Add a repository.*"
      - stopApp
