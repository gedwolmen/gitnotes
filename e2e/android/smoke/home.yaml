appId: org.gitnotes.app
name: Android Smoke - Home Screen Actions
tags:
  - smoke
  - android
---

- launchApp

- runFlow:
    file: ./onboarding.yaml

- waitForAnimationToEnd

- assertVisible:
    id: home.button.create-note

- assertVisible:
    id: home.button.open-journal

- assertVisible:
    id: home.button.open-templates

- assertVisible:
    id: home.button.navigate
