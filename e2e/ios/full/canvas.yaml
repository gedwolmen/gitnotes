appId: com.xaventra.gitnotes
name: iOS - Canvas Flow
tags:
  - full
  - ios
  - canvas
---

- launchApp:
    clearState: false

- tapOn:
    id: tab-bar.tab.press-HomeTab

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: home.button.navigate

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: canvas-list.button.create

- tapOn:
    id: canvas-list.button.create

- waitForAnimationToEnd:
    timeout: 3000

- inputText:
    id: canvas-list.input.title
    text: "E2E Canvas Test"

- tapOn:
    id: canvas-list.button.pick-size-small

- tapOn:
    id: canvas-list.button.create-confirm

- waitForAnimationToEnd:
    timeout: 5000
