appId: com.xaventra.gitnotes
name: iOS - Chat Full Flow
tags:
  - full
  - ios
  - chat
---

- launchApp:
    clearState: false

- tapOn:
    id: tab-bar.tab.press-SettingsTab

- scrollUntilVisible:
    element:
      id: settings.toggle.ai
    direction: DOWN

- tapOn:
    id: settings.toggle.ai

- tapOn:
    id: tab-bar.tab.press-NotesTab

- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    id: floating-ai.button.navigate-chat

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    text: GitNotes AI

- tapOn:
    id: chat-thread-list.button.new-chat

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: chat-input.input.message

- tapOn:
    id: chat-input.input.message

- inputText:
    text: "Test message"

- tapOn:
    id: chat-input.button.send

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: tab-bar.tab.press-HomeTab

- waitForAnimationToEnd:
    timeout: 1000

- assertVisible:
    id: home.button.create-note