appId: com.xaventra.gitnotes
name: iOS - Settings Flow
tags:
  - full
  - ios
  - settings
---

- launchApp:
    clearState: false

- tapOn:
    id: tab-bar.tab.press-SettingsTab

- assertVisible:
    text: "Settings"

- scrollUntilVisible:
    element:
      id: settings.toggle.neu
    direction: DOWN

- tapOn:
    id: settings.toggle.neu

- tapOn:
    id: settings.toggle.neu

- scrollUntilVisible:
    element:
      id: settings.toggle.biometric-lock
    direction: DOWN

- scrollUntilVisible:
    element:
      id: settings.toggle.sync-frequently
    direction: DOWN

- tapOn:
    id: settings.button.interval-picker

- back

- scrollUntilVisible:
    element:
      id: settings.toggle.background-sync
    direction: DOWN

- scrollUntilVisible:
    element:
      id: settings.button.add-account
    direction: UP

- assertVisible:
    id: settings.button.add-account
