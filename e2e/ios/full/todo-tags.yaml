appId: com.xaventra.gitnotes
name: iOS - Todo Tags Flow
tags:
  - full
  - ios
  - todos
---

- launchApp:
    clearState: false

- tapOn:
    id: tab-bar.tab.press-TodosTab

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: todo-list.icon-button.add

- waitForAnimationToEnd:
    timeout: 3000

- inputText:
    id: todo-editor.input.text
    text: "E2E Todo with Tags"

- inputText:
    id: todo-editor.input.notes
    text: "Testing tag display and padding"

- tapOn:
    id: todo-editor.button.submit

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: todo-list.icon-button.add
