[package]
name = "expo-git2-rs"
version = "0.1.0"
edition = "2021"
description = "Native Git operations via git2-rs for Expo/React Native"
license = "GPL-3.0"
homepage = "https://github.com/gedwolmen/gitnotes"
repository = "https://github.com/gedwolmen/gitnotes"
authors = ["GitNotēs Contributors"]

[dependencies]
git2 = { version = "0.21", features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
log = "0.4"
env_logger = "0.11"

[lib]
name = "expo_git2_rs"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "expo_git2_rs"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
strip = true
